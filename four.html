<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Number Guess - Connect 4</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07152f, #123c69);
      color: white;
      padding: 20px;
    }

    header {
      max-width: 850px;
      margin: 10px auto 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h2 {
      color: #20d5ff;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 15px auto;
      max-width: 850px;
    }

    nav a {
      background: #193c63;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    nav a:hover {
      background: #087fa9;
    }

    .logout {
      background: #e84b61;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
    }

    .game {
      max-width: 480px;
      margin: 30px auto;
      padding: 26px 20px;
      text-align: center;
      background: #101f3d;
      border: 1px solid #294a70;
      border-radius: 18px;
      box-shadow: 0 12px 35px #0005;
    }

    h1 {
      color: #20d5ff;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .row-label {
      color: #9db3cf;
      font-size: 13px;
      margin: 6px 0 6px;
      text-align: left;
    }

    .opt {
      flex: 1;
      padding: 11px 4px;
      border: 1px solid #395779;
      border-radius: 10px;
      background: #08172e;
      color: #b9c9df;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .opt.active {
      border-color: #20d5ff;
      background: #123c69;
      color: white;
    }

    .hidden {
      display: none;
    }

    .scores {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .score-box {
      flex: 1;
      background: #08172e;
      border-radius: 10px;
      padding: 12px 6px;
    }

    .score-box p {
      color: #aebed3;
      font-size: 12px;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .score-box strong {
      color: #20d5ff;
      font-size: 24px;
    }

    .status {
      min-height: 30px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: bold;
      color: #b9c9df;
    }

    .info {
      color: #9db3cf;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .secondary {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #395779;
      border-radius: 8px;
      background: #263d5c;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #08a9d5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary:hover {
      background: #087fa9;
    }

    footer {
      text-align: center;
      color: #9db3cf;
      margin: 35px auto 15px;
      font-size: 13px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: min(100%, 420px);
      margin: 0 auto 20px;
      padding: 10px;
      background: #1a4fa3;
      border: 3px solid #123c80;
      border-radius: 16px;
    }

    .slot {
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 50%;
      background: #08172e;
      box-shadow: inset 0 3px 6px #0008;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    .slot:disabled {
      cursor: not-allowed;
    }

    .slot .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .slot .disc.r {
      background: radial-gradient(circle at 35% 30%, #ff9aa5, #ff5f6d 55%, #c93a49);
    }

    .slot .disc.y {
      background: radial-gradient(circle at 35% 30%, #ffe9a3, #f6ca45 55%, #c9971c);
    }

    .slot .disc.drop {
      animation: drop-in 0.35s ease-in;
    }

    .slot .disc.win {
      outline: 4px solid #ffffff;
      outline-offset: -4px;
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes drop-in {
      from { transform: translateY(calc(var(--fall, 3) * -110%)); }
      to   { transform: translateY(0); }
    }

    @keyframes pulse {
      from { filter: brightness(1); }
      to   { filter: brightness(1.45); }
    }

    .hint-col {
      color: #9db3cf;
      font-size: 12px;
      margin: -6px 0 12px;
    }
  </style>
</head>

<body>

  <header>
    <h2>🎯 Number Guess</h2>
    <button class="logout" id="logoutBtn">Logout</button>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="index.html">Play Game</a>
    <a href="tik.html">Tic Tac Toe</a>
    <a href="four.html">Connect 4</a>
    <a href="dots.html">Dots &amp; Boxes</a>
    <a href="maze.html">Mini Maze</a>
    <a href="leader.html">Leaderboard</a>
    <a href="shop.html">Shop</a>
    <a href="profile.html">Profile</a>
  </nav>

  <main class="game">

    <h1>🔴 Connect 4 🟡</h1>

    <div class="row-label">Game mode</div>
    <div class="row" id="modeRow">
      <button class="opt" data-mode="ai">1 vs Computer</button>
      <button class="opt" data-mode="pvp">1 vs 1</button>
    </div>

    <div id="aiOptions">

      <div class="row-label">Computer level</div>
      <div class="row" id="levelRow">
        <button class="opt" data-level="easy">Easy</button>
        <button class="opt" data-level="medium">Medium</button>
        <button class="opt" data-level="hard">Hard</button>
      </div>

      <div class="row-label">You play as (Red goes first)</div>
      <div class="row" id="sideRow">
        <button class="opt" data-side="R">🔴 Red</button>
        <button class="opt" data-side="Y">🟡 Yellow</button>
      </div>

    </div>

    <div class="scores">
      <div class="score-box">
        <p id="labelR">You (🔴)</p>
        <strong id="scoreR">0</strong>
      </div>
      <div class="score-box">
        <p>Draws</p>
        <strong id="scoreDraw">0</strong>
      </div>
      <div class="score-box">
        <p id="labelY">Computer (🟡)</p>
        <strong id="scoreY">0</strong>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <p class="hint-col">Tap any column to drop your disc. Connect 4 in a row to win.</p>

    <div class="board" id="board"></div>

    <button class="primary" id="newRoundBtn">New Round</button>
    <button class="secondary" id="resetBtn">Reset Scores</button>
    <button class="secondary" id="homeBtn">Back to Home</button>

  </main>

  <footer>
    © 2026 Number Guess
  </footer>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDhigYBT68Dv4pdboLzVYxnLVMK6VUFFWY",
      authDomain: "number-guss.firebaseapp.com",
      projectId: "number-guss",
      storageBucket: "number-guss.firebasestorage.app",
      messagingSenderId: "471501648483",
      appId: "1:471501648483:web:3cbe55c24fd4e0c92b3e56",
      measurementId: "G-4FYB07JSC5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // Elements
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const aiOptions = document.getElementById("aiOptions");
    const labelR = document.getElementById("labelR");
    const labelY = document.getElementById("labelY");
    const scoreREl = document.getElementById("scoreR");
    const scoreYEl = document.getElementById("scoreY");
    const scoreDrawEl = document.getElementById("scoreDraw");
    const newRoundBtn = document.getElementById("newRoundBtn");
    const resetBtn = document.getElementById("resetBtn");
    const homeBtn = document.getElementById("homeBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const modeButtons = document.querySelectorAll("#modeRow .opt");
    const levelButtons = document.querySelectorAll("#levelRow .opt");
    const sideButtons = document.querySelectorAll("#sideRow .opt");

    // Board size
    const ROWS = 6;
    const COLS = 7;

    // Order to try columns (center first makes the computer smarter and faster)
    const COLUMN_ORDER = [3, 2, 4, 1, 5, 0, 6];

    // How deep the Hard computer looks ahead
    const HARD_DEPTH = 5;

    // Game state ("R" = Red, "Y" = Yellow)
    let board = Array(ROWS * COLS).fill("");
    let current = "R";
    let gameOver = false;
    let busy = false;
    let mode = "ai";       // "ai" or "pvp"
    let level = "medium";  // "easy", "medium" or "hard"
    let human = "R";       // your color in 1 vs Computer
    let scores = { R: 0, Y: 0, draw: 0 };
    let roundId = 0;       // stops old computer moves after a reset
    let lastIndex = -1;    // the disc that was just dropped
    let winCells = [];

    // ---------- Game logic ----------
    function other(color) {
      return color === "R" ? "Y" : "R";
    }

    // Lowest empty row in a column, or -1 if the column is full
    function dropRow(b, col) {

      for (let row = ROWS - 1; row >= 0; row--) {
        if (!b[row * COLS + col]) {
          return row;
        }
      }

      return -1;

    }

    function validColumns(b) {
      return COLUMN_ORDER.filter((col) => dropRow(b, col) >= 0);
    }

    // The four directions to look for 4 in a row
    const DIRECTIONS = [[0, 1], [1, 0], [1, 1], [1, -1]];

    // Returns { winner, cells } or null
    function findWinner(b) {

      for (let row = 0; row < ROWS; row++) {

        for (let col = 0; col < COLS; col++) {

          const color = b[row * COLS + col];

          if (!color) {
            continue;
          }

          for (const [dr, dc] of DIRECTIONS) {

            const cells = [row * COLS + col];

            for (let step = 1; step < 4; step++) {

              const r = row + dr * step;
              const c = col + dc * step;

              if (r < 0 || r >= ROWS || c < 0 || c >= COLS) {
                break;
              }

              if (b[r * COLS + c] !== color) {
                break;
              }

              cells.push(r * COLS + c);

            }

            if (cells.length === 4) {
              return { winner: color, cells: cells };
            }

          }

        }

      }

      return null;

    }

    function isFull(b) {
      return validColumns(b).length === 0;
    }

    // Would dropping in this column win for `color`?
    function winsByPlaying(b, col, color) {

      const row = dropRow(b, col);

      if (row < 0) {
        return false;
      }

      b[row * COLS + col] = color;

      const result = findWinner(b);

      b[row * COLS + col] = "";

      return Boolean(result && result.winner === color);

    }

    // Score a window of 4 cells for the computer
    function scoreWindow(cells, cpu) {

      const opp = other(cpu);

      let mine = 0;
      let theirs = 0;
      let empty = 0;

      cells.forEach((value) => {
        if (value === cpu) mine++;
        else if (value === opp) theirs++;
        else empty++;
      });

      if (mine === 3 && empty === 1) return 50;
      if (mine === 2 && empty === 2) return 10;
      if (theirs === 3 && empty === 1) return -80;
      if (theirs === 2 && empty === 2) return -10;

      return 0;

    }

    // How good is this board for the computer?
    function evaluate(b, cpu) {

      let score = 0;

      // Center column is the strongest
      for (let row = 0; row < ROWS; row++) {
        if (b[row * COLS + 3] === cpu) {
          score += 6;
        }
      }

      for (let row = 0; row < ROWS; row++) {

        for (let col = 0; col < COLS; col++) {

          for (const [dr, dc] of DIRECTIONS) {

            const endR = row + dr * 3;
            const endC = col + dc * 3;

            if (endR < 0 || endR >= ROWS || endC < 0 || endC >= COLS) {
              continue;
            }

            const cells = [];

            for (let step = 0; step < 4; step++) {
              cells.push(b[(row + dr * step) * COLS + (col + dc * step)]);
            }

            score += scoreWindow(cells, cpu);

          }

        }

      }

      return score;

    }

    // Minimax with alpha-beta pruning
    function minimax(b, depth, alpha, beta, maximizing, cpu) {

      const result = findWinner(b);

      if (result) {
        return result.winner === cpu ? 1000000 + depth : -1000000 - depth;
      }

      const columns = validColumns(b);

      if (columns.length === 0) {
        return 0;
      }

      if (depth === 0) {
        return evaluate(b, cpu);
      }

      const player = maximizing ? cpu : other(cpu);

      let best = maximizing ? -Infinity : Infinity;

      for (const col of columns) {

        const row = dropRow(b, col);

        b[row * COLS + col] = player;

        const score = minimax(b, depth - 1, alpha, beta, !maximizing, cpu);

        b[row * COLS + col] = "";

        if (maximizing) {
          best = Math.max(best, score);
          alpha = Math.max(alpha, best);
        } else {
          best = Math.min(best, score);
          beta = Math.min(beta, best);
        }

        if (alpha >= beta) {
          break;
        }

      }

      return best;

    }

    function randomOf(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // Choose the computer's column
    function pickColumn() {

      const cpu = other(human);
      const columns = validColumns(board);

      if (level === "easy") {
        return randomOf(columns);
      }

      // Win now if possible
      for (const col of columns) {
        if (winsByPlaying(board, col, cpu)) {
          return col;
        }
      }

      // Block your winning move
      for (const col of columns) {
        if (winsByPlaying(board, col, human)) {
          return col;
        }
      }

      if (level === "medium") {

        // Avoid moves that let you win right after, then prefer the middle
        const safe = columns.filter((col) => {

          const row = dropRow(board, col);

          board[row * COLS + col] = cpu;

          const gives = dropRow(board, col) >= 0 &&
            winsByPlaying(board, col, human);

          board[row * COLS + col] = "";

          return !gives;

        });

        const pool = safe.length > 0 ? safe : columns;

        // Closer to the middle = more likely
        const weighted = [];

        pool.forEach((col) => {
          const weight = 4 - Math.abs(3 - col);
          for (let i = 0; i < weight; i++) {
            weighted.push(col);
          }
        });

        return randomOf(weighted);

      }

      // Hard: look several moves ahead
      let bestScore = -Infinity;
      let bestColumns = [];

      for (const col of columns) {

        const row = dropRow(board, col);

        board[row * COLS + col] = cpu;

        const score = minimax(
          board, HARD_DEPTH - 1, -Infinity, Infinity, false, cpu
        );

        board[row * COLS + col] = "";

        if (score > bestScore) {
          bestScore = score;
          bestColumns = [col];
        } else if (score === bestScore) {
          bestColumns.push(col);
        }

      }

      return randomOf(bestColumns);

    }

    // ---------- Names and text ----------
    function nameOf(color) {

      if (mode === "ai") {
        return color === human ? "You" : "Computer";
      }

      return color === "R" ? "Player 1" : "Player 2";

    }

    function icon(color) {
      return color === "R" ? "🔴" : "🟡";
    }

    function updateLabels() {

      labelR.textContent = nameOf("R") + " (🔴)";
      labelY.textContent = nameOf("Y") + " (🟡)";

    }

    function updateScores() {

      scoreREl.textContent = scores.R;
      scoreYEl.textContent = scores.Y;
      scoreDrawEl.textContent = scores.draw;

    }

    function setActive(buttons, attribute, value) {

      buttons.forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset[attribute] === value
        );
      });

    }

    function updateOptionButtons() {

      setActive(modeButtons, "mode", mode);
      setActive(levelButtons, "level", level);
      setActive(sideButtons, "side", human);

      aiOptions.classList.toggle("hidden", mode !== "ai");

    }

    function showTurn() {

      if (mode === "ai" && current !== human) {
        statusEl.textContent = "💻 Computer is thinking...";
        return;
      }

      statusEl.textContent = mode === "ai"
        ? "Your turn " + icon(current)
        : nameOf(current) + "'s turn " + icon(current);

    }

    // ---------- Drawing the board ----------
    function buildBoard() {

      boardEl.replaceChildren();

      for (let i = 0; i < ROWS * COLS; i++) {

        const slot = document.createElement("button");

        slot.className = "slot";
        slot.type = "button";
        slot.dataset.col = i % COLS;
        slot.setAttribute("aria-label", "Column " + ((i % COLS) + 1));

        const disc = document.createElement("div");
        disc.className = "disc";
        disc.style.display = "none";

        slot.appendChild(disc);

        boardEl.appendChild(slot);

      }

    }

    function drawBoard() {

      const slots = boardEl.children;

      for (let i = 0; i < ROWS * COLS; i++) {

        const slot = slots[i];
        const disc = slot.firstChild;
        const value = board[i];

        if (value) {

          disc.style.display = "block";
          disc.className =
            "disc " + (value === "R" ? "r" : "y") +
            (i === lastIndex ? " drop" : "") +
            (winCells.includes(i) ? " win" : "");

          if (i === lastIndex) {
            disc.style.setProperty("--fall", Math.floor(i / COLS) + 1);
          }

        } else {

          disc.style.display = "none";

        }

        slot.disabled = gameOver;

      }

    }

    // ---------- Playing ----------
    function startRound() {

      roundId++;

      board = Array(ROWS * COLS).fill("");
      current = "R";
      gameOver = false;
      busy = false;
      lastIndex = -1;
      winCells = [];

      drawBoard();
      showTurn();

      // If you play as Yellow, the computer goes first
      if (mode === "ai" && human === "Y") {
        computerTurn();
      }

    }

    function finishRound(result) {

      gameOver = true;

      if (result) {

        scores[result.winner]++;

        winCells = result.cells;

        if (mode === "ai") {
          statusEl.textContent = result.winner === human
            ? "🎉 You win!"
            : "💻 Computer wins!";
        } else {
          statusEl.textContent =
            "🎉 " + nameOf(result.winner) + " " + icon(result.winner) + " wins!";
        }

      } else {

        scores.draw++;

        statusEl.textContent = "🤝 It's a draw!";

      }

      drawBoard();
      updateScores();

    }

    function play(col) {

      const row = dropRow(board, col);

      if (row < 0) {
        return;
      }

      lastIndex = row * COLS + col;

      board[lastIndex] = current;

      const result = findWinner(board);

      if (result) {
        finishRound(result);
        return;
      }

      if (isFull(board)) {
        finishRound(null);
        return;
      }

      current = other(current);

      drawBoard();
      showTurn();

      if (mode === "ai" && current !== human) {
        computerTurn();
      }

    }

    function computerTurn() {

      busy = true;

      const myRound = roundId;

      // Let the screen draw first, then think
      setTimeout(() => {

        if (myRound !== roundId || gameOver) {
          return;
        }

        const col = pickColumn();

        busy = false;

        play(col);

      }, 550);

    }

    // Click on the board
    boardEl.addEventListener("click", (event) => {

      const slot = event.target.closest(".slot");

      if (!slot || gameOver || busy) {
        return;
      }

      if (mode === "ai" && current !== human) {
        return;
      }

      play(Number(slot.dataset.col));

    });

    // ---------- Settings ----------
    // Changing a setting resets the scores and starts a new round
    function applySettings() {

      scores = { R: 0, Y: 0, draw: 0 };

      updateOptionButtons();
      updateLabels();
      updateScores();
      startRound();

    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        applySettings();
      });
    });

    levelButtons.forEach((button) => {
      button.addEventListener("click", () => {
        level = button.dataset.level;
        applySettings();
      });
    });

    sideButtons.forEach((button) => {
      button.addEventListener("click", () => {
        human = button.dataset.side;
        applySettings();
      });
    });

    newRoundBtn.addEventListener("click", () => {
      startRound();
    });

    resetBtn.addEventListener("click", () => {
      applySettings();
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "home.html";
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {

      logoutBtn.disabled = true;

      try {

        await signOut(auth);

        window.location.replace("login.html");

      } catch (error) {

        console.error(error);

        statusEl.textContent = "Logout failed. Please try again.";

        logoutBtn.disabled = false;

      }

    });

    // Start
    buildBoard();
    applySettings();

    // Login check
    onAuthStateChanged(auth, (user) => {

      if (!user) {
        window.location.replace("login.html");
      }

    });

  </script>

</body>
</html>
