

name: Number Guess Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'google-services.json'
      - 'number_guess_icon.png'
      - 'number_guess_splash.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/aryan/numberguess
          mkdir -p app/src/main/res/drawable-nodpi

          test -f google-services.json || {
            echo "google-services.json is missing!"
            exit 1
          }

          cp google-services.json app/google-services.json
          cp number_guess_icon.png app/src/main/res/drawable-nodpi/app_icon.png
          cp number_guess_splash.png app/src/main/res/drawable-nodpi/splash.png

          python3 -c "import json; d=json.load(open('google-services.json')); assert any(c['client_info']['android_client_info']['package_name']=='com.aryan.numberguess' for c in d['client']), 'Android package name mismatch!'"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NumberGuess"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.aryan.numberguess'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aryan.numberguess'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Number Guess"
                  android:icon="@drawable/app_icon"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".NumberGuessMessagingService"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/aryan/numberguess/MainActivity.java <<'EOF'
          package com.aryan.numberguess;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.google.firebase.messaging.FirebaseMessaging;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView webView;
              private FrameLayout layout;
              private ImageView splash;
              private String fcmToken = "";

              private static final int NOTIFICATION_PERMISSION_REQUEST = 701;

              private static final String HOME_URL =
                  "https://aryanchaudhari547-stack.github.io/Number-guss/home.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  layout = new FrameLayout(this);

                  webView = new WebView(this);
                  layout.addView(webView);

                  splash = new ImageView(this);
                  splash.setImageResource(R.drawable.splash);
                  splash.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  layout.addView(splash);

                  setContentView(layout);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.addJavascriptInterface(new AndroidBridge(), "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request
                      ) {
                          String host = request.getUrl().getHost();
                          return host == null ||
                              !host.equals("aryanchaudhari547-stack.github.io");
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          if (splash != null && splash.getParent() != null) {
                              splash.animate()
                                  .alpha(0f)
                                  .setDuration(350)
                                  .withEndAction(() -> {
                                      if (splash != null &&
                                          splash.getParent() == layout) {
                                          layout.removeView(splash);
                                      }
                                  }).start();
                          }

                          sendTokenToWebsite();
                      }
                  });

                  webView.loadUrl(HOME_URL);

                  askNotificationPermission();

                  FirebaseMessaging.getInstance().getToken()
                      .addOnCompleteListener(task -> {
                          if (task.isSuccessful() && task.getResult() != null) {
                              fcmToken = task.getResult();

                              getSharedPreferences("number_guess", MODE_PRIVATE)
                                  .edit()
                                  .putString("fcm_token", fcmToken)
                                  .apply();

                              sendTokenToWebsite();
                          }
                      });
              }

              private void askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(
                          this, Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{Manifest.permission.POST_NOTIFICATIONS},
                          NOTIFICATION_PERMISSION_REQUEST
                      );
                  }
              }

              private void sendTokenToWebsite() {
                  if (webView == null) return;

                  if (fcmToken.isEmpty()) {
                      fcmToken = getSharedPreferences(
                          "number_guess", MODE_PRIVATE
                      ).getString("fcm_token", "");
                  }

                  if (fcmToken.isEmpty()) return;

                  String safeToken = JSONObject.quote(fcmToken);

                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript(
                              "if(window.onNativeFcmToken){" +
                              "window.onNativeFcmToken(" + safeToken + ");}",
                              null
                          );
                      }
                  });
              }

              private class AndroidBridge {
                  @JavascriptInterface
                  public void requestFcmToken() {
                      runOnUiThread(() -> sendTokenToWebsite());
                  }

                  @JavascriptInterface
                  public String platform() {
                      return "android";
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("Android");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/aryan/numberguess/NumberGuessMessagingService.java <<'EOF'
          package com.aryan.numberguess;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class NumberGuessMessagingService
              extends FirebaseMessagingService {

              private static final String CHANNEL_ID = "number_guess_updates";

              @Override
              public void onNewToken(String token) {
                  super.onNewToken(token);

                  getSharedPreferences("number_guess", MODE_PRIVATE)
                      .edit()
                      .putString("fcm_token", token)
                      .apply();
              }

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  super.onMessageReceived(message);

                  String title = "Number Guess";
                  String body = "You have a new update.";

                  if (message.getNotification() != null) {
                      if (message.getNotification().getTitle() != null) {
                          title = message.getNotification().getTitle();
                      }

                      if (message.getNotification().getBody() != null) {
                          body = message.getNotification().getBody();
                      }
                  }

                  if (message.getData().containsKey("title")) {
                      title = message.getData().get("title");
                  }

                  if (message.getData().containsKey("body")) {
                      body = message.getData().get("body");
                  }

                  showNotification(title, body);
              }

              private void showNotification(String title, String body) {
                  NotificationManager manager =
                      (NotificationManager) getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "Number Guess updates",
                              NotificationManager.IMPORTANCE_DEFAULT
                          );

                      manager.createNotificationChannel(channel);
                  }

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                      PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder notification =
                      new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent)
                          .setPriority(NotificationCompat.PRIORITY_DEFAULT);

                  manager.notify(
                      (int) System.currentTimeMillis(),
                      notification.build()
                  );
              }
          }
          EOF

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberGuess-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
