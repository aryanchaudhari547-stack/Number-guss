<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guess - Tic Tac Toe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07152f, #123c69);
      color: white;
      padding: 20px;
    }
    header {
      max-width: 850px;
      margin: 10px auto 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h2 {
      color: #20d5ff;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 15px auto;
      max-width: 850px;
    }
    nav a {
      background: #193c63;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    nav a:hover {
      background: #087fa9;
    }
    .logout {
      background: #e84b61;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
    }
    .game {
      max-width: 480px;
      margin: 30px auto;
      padding: 26px 20px;
      text-align: center;
      background: #101f3d;
      border: 1px solid #294a70;
      border-radius: 18px;
      box-shadow: 0 12px 35px #0005;
    }
    h1 {
      color: #20d5ff;
      margin-bottom: 18px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .row-label {
      color: #9db3cf;
      font-size: 13px;
      margin: 6px 0 6px;
      text-align: left;
    }
    .opt {
      flex: 1;
      padding: 11px 4px;
      border: 1px solid #395779;
      border-radius: 10px;
      background: #08172e;
      color: #b9c9df;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .opt.active {
      border-color: #20d5ff;
      background: #123c69;
      color: white;
    }
    .hidden {
      display: none;
    }
    .scores {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .score-box {
      flex: 1;
      background: #08172e;
      border-radius: 10px;
      padding: 12px 6px;
    }
    .score-box p {
      color: #aebed3;
      font-size: 12px;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }
    .score-box strong {
      color: #20d5ff;
      font-size: 24px;
    }
    .status {
      min-height: 30px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: bold;
      color: #b9c9df;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(100%, 340px);
      margin: 0 auto 20px;
    }
    .cell {
      aspect-ratio: 1 / 1;
      border: 2px solid #395779;
      border-radius: 12px;
      background: #08172e;
      color: white;
      font-size: 54px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .cell:hover:not(:disabled) {
      background: #123c69;
    }
    .cell:active:not(:disabled) {
      transform: scale(0.96);
    }
    .cell:disabled {
      cursor: not-allowed;
    }
    .cell.x {
      color: #20d5ff;
    }
    .cell.o {
      color: #f6ca45;
    }
    .cell.win {
      background: #1f8f66;
      border-color: #45e6a0;
      color: white;
    }
    .secondary {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #395779;
      border-radius: 8px;
      background: #263d5c;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    .primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #08a9d5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary:hover {
      background: #087fa9;
    }
    footer {
      text-align: center;
      color: #9db3cf;
      margin: 35px auto 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h2>🎯 Number Guess</h2>
    <button class="logout" id="logoutBtn">Logout</button>
  </header>
  <nav>
    <a href="home.html">Home</a>
    <a href="index.html">Play Game</a>
    <a href="tik.html">Tic Tac Toe</a>
    <a href="leader.html">Leaderboard</a>
    <a href="profile.html">Profile</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>
  <main class="game">
    <h1>❌ Tic Tac Toe ⭕</h1>
    <div class="row-label">Game mode</div>
    <div class="row" id="modeRow">
      <button class="opt" data-mode="ai">1 vs Computer</button>
      <button class="opt" data-mode="pvp">1 vs 1</button>
    </div>
    <div id="aiOptions">
      <div class="row-label">Computer level</div>
      <div class="row" id="levelRow">
        <button class="opt" data-level="easy">Easy</button>
        <button class="opt" data-level="medium">Medium</button>
        <button class="opt" data-level="hard">Hard</button>
      </div>
      <div class="row-label">You play as (X goes first)</div>
      <div class="row" id="sideRow">
        <button class="opt" data-side="X">❌ X</button>
        <button class="opt" data-side="O">⭕ O</button>
      </div>
    </div>
    <div class="scores">
      <div class="score-box">
        <p id="labelX">You (X)</p>
        <strong id="scoreX">0</strong>
      </div>
      <div class="score-box">
        <p>Draws</p>
        <strong id="scoreDraw">0</strong>
      </div>
      <div class="score-box">
        <p id="labelO">Computer (O)</p>
        <strong id="scoreO">0</strong>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="board" id="board"></div>
    <button class="primary" id="newRoundBtn">New Round</button>
    <button class="secondary" id="resetBtn">Reset Scores</button>
    <button class="secondary" id="homeBtn">Back to Home</button>
  </main>
  <footer>
    © 2026 Number Guess
  </footer>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDhigYBT68Dv4pdboLzVYxnLVMK6VUFFWY",
      authDomain: "number-guss.firebaseapp.com",
      projectId: "number-guss",
      storageBucket: "number-guss.firebasestorage.app",
      messagingSenderId: "471501648483",
      appId: "1:471501648483:web:3cbe55c24fd4e0c92b3e56",
      measurementId: "G-4FYB07JSC5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Elements
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const aiOptions = document.getElementById("aiOptions");
    const labelX = document.getElementById("labelX");
    const labelO = document.getElementById("labelO");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");
    const scoreDrawEl = document.getElementById("scoreDraw");
    const newRoundBtn = document.getElementById("newRoundBtn");
    const resetBtn = document.getElementById("resetBtn");
    const homeBtn = document.getElementById("homeBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const modeButtons = document.querySelectorAll("#modeRow .opt");
    const levelButtons = document.querySelectorAll("#levelRow .opt");
    const sideButtons = document.querySelectorAll("#sideRow .opt");

    // Winning lines
    const LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    // Game state
    let board = Array(9).fill("");
    let current = "X";
    let gameOver = false;
    let busy = false;
    let mode = "ai";        // "ai" or "pvp"
    let level = "hard";     // "easy", "medium" or "hard"
    let human = "X";        // your symbol in 1 vs Computer
    let scores = { X: 0, O: 0, draw: 0 };
    let roundId = 0;        // stops old computer moves after a reset

    // ---------- Game logic ----------

    // Returns { winner, line } or null
    function findWinner(b) {
      for (const line of LINES) {
        const [a, c, d] = line;
        if (b[a] && b[a] === b[c] && b[a] === b[d]) {
          return { winner: b[a], line: line };
        }
      }
      return null;
    }

    function emptyCells(b) {
      const cells = [];
      b.forEach((value, index) => {
        if (!value) {
          cells.push(index);
        }
      });
      return cells;
    }

    function other(symbol) {
      return symbol === "X" ? "O" : "X";
    }

    // Finds a cell where `symbol` would win right now
    function findWinningMove(b, symbol) {
      for (const cell of emptyCells(b)) {
        b[cell] = symbol;
        const result = findWinner(b);
        b[cell] = "";
        if (result && result.winner === symbol) {
          return cell;
        }
      }
      return -1;
    }

    // Minimax: the computer never loses on Hard
    function minimax(b, turn, cpu, depth) {
      const result = findWinner(b);
      if (result) {
        return result.winner === cpu ? 10 - depth : depth - 10;
      }
      const moves = emptyCells(b);
      if (moves.length === 0) {
        return 0;
      }
      let best = turn === cpu ? -Infinity : Infinity;
      for (const move of moves) {
        b[move] = turn;
        const score = minimax(b, other(turn), cpu, depth + 1);
        b[move] = "";
        best = turn === cpu
          ? Math.max(best, score)
          : Math.min(best, score);
      }
      return best;
    }

    function randomOf(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // Choose the computer's move
    function pickMove() {
      const cpu = other(human);
      const moves = emptyCells(board);
      if (level === "easy") {
        return randomOf(moves);
      }
      if (level === "medium") {
        // Win if possible, then block, then center, then random
        const win = findWinningMove(board, cpu);
        if (win >= 0) {
          return win;
        }
        const block = findWinningMove(board, human);
        if (block >= 0) {
          return block;
        }
        if (!board[4]) {
          return 4;
        }
        return randomOf(moves);
      }
      // Hard: try every move and keep the best ones
      let bestScore = -Infinity;
      let bestMoves = [];
      for (const move of moves) {
        board[move] = cpu;
        const score = minimax(board, human, cpu, 1);
        board[move] = "";
        if (score > bestScore) {
          bestScore = score;
          bestMoves = [move];
        } else if (score === bestScore) {
          bestMoves.push(move);
        }
      }
      return randomOf(bestMoves);
    }

    // ---------- Names and text ----------
    function nameOf(symbol) {
      if (mode === "ai") {
        return symbol === human ? "You" : "Computer";
      }
      return symbol === "X" ? "Player 1" : "Player 2";
    }

    function updateLabels() {
      labelX.textContent = nameOf("X") + " (X)";
      labelO.textContent = nameOf("O") + " (O)";
    }

    function updateScores() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDrawEl.textContent = scores.draw;
    }

    function setActive(buttons, attribute, value) {
      buttons.forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset[attribute] === value
        );
      });
    }

    function updateOptionButtons() {
      setActive(modeButtons, "mode", mode);
      setActive(levelButtons, "level", level);
      setActive(sideButtons, "side", human);
      aiOptions.classList.toggle("hidden", mode !== "ai");
    }

    function showTurn() {
      if (mode === "ai" && current !== human) {
        statusEl.textContent = "💻 Computer is thinking...";
        return;
      }
      statusEl.textContent = mode === "ai"
        ? "Your turn (" + current + ")"
        : nameOf(current) + "'s turn (" + current + ")";
    }

    // ---------- Drawing the board ----------
    function buildBoard() {
      boardEl.replaceChildren();
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.type = "button";
        cell.dataset.index = i;
        cell.setAttribute("aria-label", "Cell " + (i + 1));
        boardEl.appendChild(cell);
      }
    }

    function drawBoard(winLine) {
      const cells = boardEl.children;
      for (let i = 0; i < 9; i++) {
        const cell = cells[i];
        const value = board[i];
        cell.textContent = value === "X" ? "❌" : value === "O" ? "⭕" : "";
        cell.classList.toggle("x", value === "X");
        cell.classList.toggle("o", value === "O");
        cell.classList.toggle(
          "win",
          Boolean(winLine && winLine.includes(i))
        );
        cell.disabled = gameOver || Boolean(value);
      }
    }

    // ---------- Playing ----------
    function startRound() {
      roundId++;
      board = Array(9).fill("");
      current = "X";
      gameOver = false;
      busy = false;
      drawBoard(null);
      showTurn();
      // If you play as O, the computer goes first
      if (mode === "ai" && human === "O") {
        computerTurn();
      }
    }

    function finishRound(result) {
      gameOver = true;
      if (result) {
        scores[result.winner]++;
        drawBoard(result.line);
        if (mode === "ai") {
          statusEl.textContent = result.winner === human
            ? "🎉 You win!"
            : "💻 Computer wins!";
        } else {
          statusEl.textContent =
            "🎉 " + nameOf(result.winner) + " (" + result.winner + ") wins!";
        }
      } else {
        scores.draw++;
        drawBoard(null);
        statusEl.textContent = "🤝 It's a draw!";
      }
      updateScores();
    }

    function place(index) {
      board[index] = current;
      const result = findWinner(board);
      if (result) {
        finishRound(result);
        return;
      }
      if (emptyCells(board).length === 0) {
        finishRound(null);
        return;
      }
      current = other(current);
      drawBoard(null);
      showTurn();
      if (mode === "ai" && current !== human) {
        computerTurn();
      }
    }

    function computerTurn() {
      busy = true;
      const myRound = roundId;
      setTimeout(() => {
        // Ignore if the round was reset while the computer was thinking
        if (myRound !== roundId || gameOver) {
          return;
        }
        busy = false;
        place(pickMove());
      }, 450);
    }

    // Click on a cell
    boardEl.addEventListener("click", (event) => {
      const cell = event.target.closest(".cell");
      if (!cell || gameOver || busy) {
        return;
      }
      if (mode === "ai" && current !== human) {
        return;
      }
      const index = Number(cell.dataset.index);
      if (board[index]) {
        return;
      }
      place(index);
    });

    // ---------- Settings ----------
    // Changing a setting resets the scores and starts a new round
    function applySettings() {
      scores = { X: 0, O: 0, draw: 0 };
      updateOptionButtons();
      updateLabels();
      updateScores();
      startRound();
    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        applySettings();
      });
    });

    levelButtons.forEach((button) => {
      button.addEventListener("click", () => {
        level = button.dataset.level;
        applySettings();
      });
    });

    sideButtons.forEach((button) => {
      button.addEventListener("click", () => {
        human = button.dataset.side;
        applySettings();
      });
    });

    newRoundBtn.addEventListener("click", () => {
      startRound();
    });

    resetBtn.addEventListener("click", () => {
      applySettings();
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "home.html";
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;
      try {
        await signOut(auth);
        window.location.replace("login.html");
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Logout failed. Please try again.";
        logoutBtn.disabled = false;
      }
    });

    // Start
    buildBoard();
    applySettings();

    // Login check
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("login.html");
      }
    });

  </script>

</body>
</html>
